<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя книга</title>
    <style>
        :root {
            --bg: #f4f4f9; --card: #fff; --text: #333; --muted: #666;
            --border: #ccc; --primary: #5a67d8; --primary-active: #434190;
            --success: #38a169; --success-active: #2f855a; --danger: #e53e3e;
        }
        body.dark {
            --bg: #1a1a2e; --card: #16213e; --text: #eaeaea; --muted: #aaa;
            --border: #444; --primary: #7f9cf5; --primary-active: #5a67d8;
            --success: #48bb78; --success-active: #38a169;
        }
        body.sepia {
            --bg: #f4ecd8; --card: #fbf5e6; --text: #3a2f1e; --muted: #7a6a4f;
            --border: #c9b896; --primary: #8b6f47; --primary-active: #6b5334;
            --success: #6b8e23;
        }
        body.night {
            --bg: #000; --card: #111; --text: #c0c0c0; --muted: #777;
            --border: #333; --primary: #444; --primary-active: #222; --success: #2f5f2f;
        }
        * { transition: background-color 0.2s, color 0.2s; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg); color: var(--text); margin: 0; padding: 15px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
        }
        h1 { font-size: 22px; color: var(--text); margin: 0; }
        .header-btns { display: flex; gap: 6px; }
        .theme-btn {
            padding: 8px 12px; font-size: 18px; background-color: var(--card);
            border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
        }
        .chapters-bar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
        .chapters-btn {
            padding: 10px 16px; font-size: 15px; background-color: var(--primary);
            color: #fff; border: none; border-radius: 8px; cursor: pointer;
            font-family: inherit; flex: 1; text-align: left;
        }
        .btn-add {
            padding: 10px 16px; font-size: 15px; background-color: var(--success);
            color: #fff; border: none; border-radius: 8px; cursor: pointer; font-family: inherit;
        }
        .chapters-dropdown {
            display: none; background-color: var(--card); border: 1px solid var(--border);
            border-radius: 8px; margin-bottom: 12px; max-height: 300px; overflow-y: auto;
        }
        .chapters-dropdown.open { display: block; }
        .chapter-item {
            padding: 12px 16px; border-bottom: 1px solid var(--border);
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
        }
        .chapter-item:last-child { border-bottom: none; }
        .chapter-item.active { background-color: var(--primary); color: #fff; }
        .chapter-delete {
            background: none; border: none; color: var(--muted);
            font-size: 18px; cursor: pointer; padding: 4px 8px;
        }
        .chapter-item.active .chapter-delete { color: #fff; }
        textarea {
            width: 100%; height: 40vh; padding: 15px; font-size: 16px; line-height: 1.6;
            border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box;
            background-color: var(--card); color: var(--text); resize: vertical; font-family: inherit;
        }
        .info-panel {
            margin-top: 10px; font-size: 14px; color: var(--muted);
            display: flex; justify-content: space-between; flex-wrap: wrap; gap: 5px;
        }
        #word-count, #total-count { font-weight: bold; color: var(--text); }
        .save-status { color: var(--success); }
        .actions { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            padding: 10px 18px; font-size: 15px; background-color: var(--primary);
            color: #fff; border: none; border-radius: 8px; cursor: pointer; font-family: inherit;
        }
        .btn-danger { background-color: var(--danger); }
        .btn-small {
            padding: 6px 12px; font-size: 13px; border-radius: 6px;
        }
        .rename-hint { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
        .stats-panel {
            margin-top: 20px; padding: 15px; background-color: var(--card);
            border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
        }
        .stats-panel h3 { margin: 0 0 10px 0; font-size: 16px; color: var(--text); }
        .stat-row { display: flex; justify-content: space-between; padding: 5px 0; color: var(--muted); }
        .stat-row strong { color: var(--text); }
        .stat-row button {
            background: none; border: none; color: var(--primary);
            cursor: pointer; font-size: 13px; text-decoration: underline;
        }
        .progress-bar {
            width: 100%; height: 10px; background-color: var(--border);
            border-radius: 5px; overflow: hidden; margin-top: 8px;
        }
        .progress-fill { height: 100%; background-color: var(--success); transition: width 0.3s; }
        .search-panel { margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border); }
        .search-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
        #search-input, #replace-input {
            flex: 1; padding: 10px 14px; font-size: 15px; border: 1px solid var(--border);
            border-radius: 8px; background-color: var(--card); color: var(--text);
            box-sizing: border-box; font-family: inherit; min-width: 150px;
        }
        .search-results { margin-top: 10px; font-size: 14px; }
        .search-result-item {
            padding: 10px; margin-bottom: 6px; background-color: var(--card);
            border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
        }
        .search-result-title { font-weight: bold; color: var(--primary); margin-bottom: 4px; }
        .search-result-snippet { color: var(--muted); font-size: 13px; font-style: italic; }
        .search-empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
        mark { background-color: #fde68a; color: #333; padding: 0 2px; border-radius: 2px; }
        .tabs { display: flex; gap: 5px; margin-top: 20px; flex-wrap: wrap; }
        .tab-btn {
            padding: 8px 14px; font-size: 14px; background-color: var(--card);
            border: 1px solid var(--border); border-radius: 8px;
            cursor: pointer; color: var(--text); font-family: inherit;
        }
        .tab-btn.active { background-color: var(--primary); color: #fff; border-color: var(--primary); }
        .tab-content { display: none; margin-top: 10px; }
        .tab-content.active { display: block; }
        .notes-textarea {
            width: 100%; height: 200px; padding: 12px; font-size: 15px; line-height: 1.5;
            border: 1px solid var(--border); border-radius: 8px; background-color: var(--card);
            color: var(--text); resize: vertical; font-family: inherit; box-sizing: border-box;
        }
        .char-photo-panel {
            margin-bottom: 10px; display: flex; flex-direction: column;
            gap: 8px; align-items: center;
        }
        .char-photo-preview { display: none; position: relative; }
        .char-photo-preview img {
            max-width: 200px; max-height: 200px;
            border-radius: 12px; border: 2px solid var(--border);
        }
        .char-name-input {
            width: 100%; padding: 10px 14px; font-size: 15px;
            border: 1px solid var(--border); border-radius: 8px;
            background-color: var(--card); color: var(--text);
            box-sizing: border-box; font-family: inherit; margin-bottom: 8px;
        }
        .trash-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 9998;
            overflow-y: auto;
            padding: 20px;
        }
        .trash-modal.open { display: block; }
        .trash-modal-content {
            max-width: 600px;
            margin: 40px auto;
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .trash-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .trash-modal-header h3 {
            margin: 0; font-size: 18px; color: var(--text);
        }
        .trash-close-btn {
            background: none; border: none;
            font-size: 24px; color: var(--muted);
            cursor: pointer; padding: 4px 10px;
        }
        .trash-item {
            padding: 12px; background-color: var(--bg);
            border: 1px solid var(--border); border-radius: 8px;
            margin-bottom: 8px;
        }
        .trash-item-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 6px;
        }
        .trash-item-title { font-weight: bold; color: var(--text); font-size: 14px; }
        .trash-item-type {
            font-size: 11px; color: var(--muted);
            background-color: var(--card); padding: 2px 8px; border-radius: 4px;
        }
        .trash-item-preview {
            font-size: 12px; color: var(--muted);
            max-height: 40px; overflow: hidden;
            text-overflow: ellipsis; margin-bottom: 8px;
        }
        .trash-item-actions { display: flex; gap: 6px; }
        body.reading-mode .container > *:not(#editor):not(.reading-exit) {
            display: none !important;
        }
        body.reading-mode .container {
            max-width: 100%;
            padding: 0;
        }
        body.reading-mode #editor {
            height: 100vh;
            border-radius: 0;
            border: none;
            font-size: 18px;
            line-height: 1.8;
            padding: 20px;
            background-color: var(--card);
        }
        .reading-exit {
            display: none;
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 9999;
            padding: 10px 14px;
            font-size: 16px;
            background-color: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        body.reading-mode .reading-exit { display: block; }
    </style>
</head>
<body>
    <button id="reading-exit" class="reading-exit">✕ Выйти</button>
    <div class="container">
        <div class="header">
            <h1>📖 Моя книга</h1>
            <div class="header-btns">
                <button id="theme-btn" class="theme-btn">🌙</button>
                <button id="trash-btn" class="theme-btn" title="Корзина">🗑</button>
            </div>
        </div>

        <div class="chapters-bar">
            <button id="chapters-btn" class="chapters-btn">📚 Главы ▾</button>
            <button id="add-chapter" class="btn-add">+ Глава</button>
        </div>
        <div id="chapters-dropdown" class="chapters-dropdown"></div>
        <div class="rename-hint">💡 Удерживай главу в списке — переименовать</div>

        <textarea id="editor" placeholder="Начни писать свою историю здесь..."></textarea>

        <div class="info-panel">
            <span>Слов в главе: <span id="word-count">0</span></span>
            <span>Всего в книге: <span id="total-count">0</span></span>
            <span id="save-status" class="save-status"></span>
        </div>

        <div class="actions">
            <button id="save-btn" class="btn">💾 Сохранить</button>
            <button id="export-btn" class="btn">📤 Скачать .txt</button>
            <button id="fullscreen-btn" class="btn">⛶ Чтение</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="notes">📝 Заметки</button>
            <button class="tab-btn" data-tab="chars">👤 Персонажи</button>
        </div>

        <div id="tab-notes" class="tab-content active">
            <div class="chapters-bar">
                <button id="notes-btn" class="chapters-btn">📝 Заметка 1 ▾</button>
                <button id="add-note" class="btn-add">+ Заметка</button>
            </div>
            <div id="notes-dropdown" class="chapters-dropdown"></div>
            <div class="rename-hint">💡 Удерживай заметку — переименовать</div>
            <textarea id="notes" class="notes-textarea" placeholder="План, идеи, что нужно не забыть..."></textarea>
        </div>

        <div id="tab-chars" class="tab-content">
            <div class="chapters-bar">
                <button id="chars-btn" class="chapters-btn">👤 Персонаж 1 ▾</button>
                <button id="add-char" class="btn-add">+ Персонаж</button>
            </div>
            <div id="chars-dropdown" class="chapters-dropdown"></div>
            <div class="rename-hint">💡 Удерживай персонажа — переименовать</div>

            <div class="char-photo-panel">
                <div id="char-photo-preview" class="char-photo-preview"></div>
                <input type="file" id="char-photo-input" accept="image/*" style="display: none;">
                <button id="char-photo-btn" class="btn">📷 Загрузить фото</button>
                <button id="char-photo-remove" class="btn btn-danger" style="display: none;">✕ Удалить фото</button>
            </div>

            <input type="text" id="char-name-input" class="char-name-input" placeholder="Имя персонажа">
            <textarea id="char-desc-input" class="notes-textarea" placeholder="Описание: внешность, характер, роль в истории..."></textarea>
        </div>

        <div id="trash-modal" class="trash-modal">
            <div class="trash-modal-content">
                <div class="trash-modal-header">
                    <h3>🗑 Корзина</h3>
                    <button id="trash-close-btn" class="trash-close-btn">✕</button>
                </div>
                <div id="trash-list"></div>
                <div class="actions" style="margin-top: 15px;">
                    <button id="clear-trash-btn" class="btn btn-danger btn-small">Очистить корзину</button>
                </div>
            </div>
        </div>

        <div class="stats-panel">
            <h3>📊 Статистика книги</h3>
            <div class="stat-row"><span>Глав написано:</span><strong id="stat-chapters">0</strong></div>
            <div class="stat-row"><span>Всего слов:</span><strong id="stat-words">0</strong></div>
            <div class="stat-row"><span>Последнее изменение:</span><strong id="stat-date">—</strong></div>
            <div class="stat-row">
                <span>Цель: <strong id="stat-goal">50000</strong> слов</span>
                <button id="edit-goal-btn">Изменить</button>
            </div>
            <div class="stat-row"><span>Прогресс:</span><strong id="stat-progress">0%</strong></div>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
            </div>
        </div>

        <div class="search-panel">
            <div class="search-row">
                <input type="text" id="search-input" placeholder="🔍 Найти...">
            </div>
            <div class="search-row">
                <input type="text" id="replace-input" placeholder="✏️ Заменить на...">
                <button id="replace-all-btn" class="btn btn-danger">Заменить всё</button>
            </div>
            <div id="search-results" class="search-results"></div>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const wordCountSpan = document.getElementById('word-count');
        const totalCountSpan = document.getElementById('total-count');
        const saveStatus = document.getElementById('save-status');
        const chaptersBtn = document.getElementById('chapters-btn');
        const chaptersDropdown = document.getElementById('chapters-dropdown');
        const addChapterBtn = document.getElementById('add-chapter');
        const saveBtn = document.getElementById('save-btn');
        const exportBtn = document.getElementById('export-btn');
        const themeBtn = document.getElementById('theme-btn');
        const trashBtn = document.getElementById('trash-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const readingExit = document.getElementById('reading-exit');
        const statChapters = document.getElementById('stat-chapters');
        const statWords = document.getElementById('stat-words');
        const statDate = document.getElementById('stat-date');
        const statProgress = document.getElementById('stat-progress');
        const statGoal = document.getElementById('stat-goal');
        const progressFill = document.getElementById('progress-fill');
        const editGoalBtn = document.getElementById('edit-goal-btn');
        const notesBtn = document.getElementById('notes-btn');
        const notesDropdown = document.getElementById('notes-dropdown');
        const addNoteBtn = document.getElementById('add-note');
        const notesArea = document.getElementById('notes');
        const charsBtn = document.getElementById('chars-btn');
        const charsDropdown = document.getElementById('chars-dropdown');
        const addCharBtn = document.getElementById('add-char');
        const charNameInput = document.getElementById('char-name-input');
        const charDescInput = document.getElementById('char-desc-input');
        const charPhotoInput = document.getElementById('char-photo-input');
        const charPhotoBtn = document.getElementById('char-photo-btn');
        const charPhotoRemove = document.getElementById('char-photo-remove');
        const charPhotoPreview = document.getElementById('char-photo-preview');
        const trashModal = document.getElementById('trash-modal');
        const trashList = document.getElementById('trash-list');
        const clearTrashBtn = document.getElementById('clear-trash-btn');
        const trashCloseBtn = document.getElementById('trash-close-btn');

        const THEMES = ['light', 'dark', 'sepia', 'night'];
        const THEME_ICONS = { light: '🌙', dark: '☀️', sepia: '📜', night: '🌑' };

        let chapters = [];
        let currentChapterId = null;
        let notesList = [];
        let currentNoteId = null;
        let characters = [];
        let currentCharId = null;
        let trash = [];

        function saveAll() {
            localStorage.setItem('myBookChapters', JSON.stringify(chapters));
            localStorage.setItem('myBookNotes', JSON.stringify(notesList));
            localStorage.setItem('myBookCharacters', JSON.stringify(characters));
            localStorage.setItem('myBookTrash', JSON.stringify(trash));
            localStorage.setItem('myBookLastModified', Date.now());
        }

        function loadAll() {
            chapters = JSON.parse(localStorage.getItem('myBookChapters') || 'null') || [{ id: Date.now(), title: 'Глава 1', text: '' }];
            notesList = JSON.parse(localStorage.getItem('myBookNotes') || 'null') || [{ id: Date.now(), title: 'Заметка 1', text: '' }];
            characters = JSON.parse(localStorage.getItem('myBookCharacters') || 'null') || [{ id: Date.now(), name: 'Персонаж 1', desc: '' }];
            trash = JSON.parse(localStorage.getItem('myBookTrash') || '[]');
            if (chapters.length > 0) currentChapterId = chapters[0].id;
            if (notesList.length > 0) currentNoteId = notesList[0].id;
            if (characters.length > 0) currentCharId = characters[0].id;
        }

        // ============ КОРЗИНА ============
        function addToTrash(type, item) {
            trash.push({
                id: Date.now() + Math.random(),
                type: type,
                title: item.title || item.name,
                data: item,
                deletedAt: Date.now()
            });
            saveAll();
        }

        function renderTrash() {
            trashList.innerHTML = '';
            if (trash.length === 0) {
                trashList.innerHTML = '<div class="search-empty">Корзина пуста</div>';
                return;
            }
            trash.forEach(t => {
                const div = document.createElement('div');
                div.className = 'trash-item';

                const header = document.createElement('div');
                header.className = 'trash-item-header';

                const title = document.createElement('div');
                title.className = 'trash-item-title';
                title.textContent = t.title || '(без названия)';

                const typeLabel = document.createElement('div');
                typeLabel.className = 'trash-item-type';
                typeLabel.textContent = t.type === 'chapter' ? '📖 Глава' : t.type === 'note' ? '📝 Заметка' : '👤 Персонаж';

                header.appendChild(title);
                header.appendChild(typeLabel);

                const preview = document.createElement('div');
                preview.className = 'trash-item-preview';
                if (t.type === 'chapter' || t.type === 'note') {
                    preview.textContent = (t.data.text || '').substring(0, 100);
                } else {
                    preview.textContent = (t.data.desc || '').substring(0, 100);
                }

                const actions = document.createElement('div');
                actions.className = 'trash-item-actions';

                const restoreBtn = document.createElement('button');
                restoreBtn.className = 'btn btn-small';
                restoreBtn.textContent = '↶ Восстановить';
                restoreBtn.onclick = () => {
                    if (t.type === 'chapter') {
                        chapters.push(t.data);
                        saveAll(); renderChapters();
                    } else if (t.type === 'note') {
                        notesList.push(t.data);
                        saveAll(); renderNotes();
                    } else {
                        characters.push(t.data);
                        saveAll(); renderCharacters();
                    }
                    trash = trash.filter(x => x.id !== t.id);
                    saveAll();
                    renderTrash();
                };

                const delBtn = document.createElement('button');
                delBtn.className = 'btn btn-danger btn-small';
                delBtn.textContent = '✕ Удалить навсегда';
                delBtn.onclick = () => {
                    let ok = true;
                    try { ok = confirm('Удалить навсегда?'); } catch (err) { ok = true; }
                    if (ok) {
                        trash = trash.filter(x => x.id !== t.id);
                        saveAll();
                        renderTrash();
                    }
                };

                actions.appendChild(restoreBtn);
                actions.appendChild(delBtn);

                div.appendChild(header);
                div.appendChild(preview);
                div.appendChild(actions);
                trashList.appendChild(div);
            });
        }

        trashBtn.onclick = () => {
            trashModal.classList.add('open');
            renderTrash();
        };

        trashCloseBtn.onclick = () => { trashModal.classList.remove('open'); };

        trashModal.onclick = (e) => {
            if (e.target === trashModal) trashModal.classList.remove('open');
        };

        clearTrashBtn.onclick = () => {
            if (trash.length === 0) return;
            let ok = true;
            try { ok = confirm('Очистить корзину полностью?'); } catch (err) { ok = true; }
            if (ok) {
                trash = [];
                saveAll();
                renderTrash();
            }
        };

        // ============ ГЛАВЫ ============
        function renderChapters() {
            const current = chapters.find(c => c.id === currentChapterId);
            chaptersBtn.textContent = '📚 ' + (current ? current.title : 'Главы') + ' ▾';
            chaptersDropdown.innerHTML = '';

            chapters.forEach(ch => {
                const item = document.createElement('div');
                item.className = 'chapter-item' + (ch.id === currentChapterId ? ' active' : '');

                const title = document.createElement('span');
                title.textContent = ch.title;

                const del = document.createElement('button');
                del.className = 'chapter-delete';
                del.textContent = '×';
                del.setAttribute('data-id', ch.id);
                del.onclick = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (chapters.length === 1) { alert('Нельзя удалить единственную главу'); return; }
                    const id = parseInt(del.getAttribute('data-id'));
                    const target = chapters.find(c => c.id === id);
                    if (!target) return;
                    let ok = true;
                    try { ok = confirm('Переместить "' + target.title + '" в корзину?'); } catch (err) { ok = true; }
                    if (ok) {
                        addToTrash('chapter', target);
                        chapters = chapters.filter(c => c.id !== id);
                        if (currentChapterId === id) currentChapterId = chapters[0].id;
                        saveAll(); renderChapters(); loadCurrentChapter();
                    }
                };

                item.appendChild(title);
                item.appendChild(del);

                item.onclick = () => {
                    saveCurrentText();
                    currentChapterId = ch.id;
                    chaptersDropdown.classList.remove('open');
                    renderChapters();
                    loadCurrentChapter();
                };

                let pressTimer;
                item.addEventListener('touchstart', () => {
                    pressTimer = setTimeout(() => {
                        const newTitle = prompt('Новое название:', ch.title);
                        if (newTitle && newTitle.trim()) { ch.title = newTitle.trim(); saveAll(); renderChapters(); }
                    }, 600);
                });
                item.addEventListener('touchend', () => clearTimeout(pressTimer));
                item.addEventListener('touchcancel', () => clearTimeout(pressTimer));

                chaptersDropdown.appendChild(item);
            });
        }

        chaptersBtn.onclick = () => chaptersDropdown.classList.toggle('open');

        function loadCurrentChapter() {
            const ch = chapters.find(c => c.id === currentChapterId);
            if (ch) { editor.value = ch.text; updateCounter(); updateStats(); }
        }

        function saveCurrentText() {
            const ch = chapters.find(c => c.id === currentChapterId);
            if (ch) { ch.text = editor.value; saveAll(); }
        }

        // ============ ЗАМЕТКИ ============
        function renderNotes() {
            const current = notesList.find(n => n.id === currentNoteId);
            notesBtn.textContent = '📝 ' + (current ? current.title : 'Заметки') + ' ▾';
            notesDropdown.innerHTML = '';

            notesList.forEach(n => {
                const item = document.createElement('div');
                item.className = 'chapter-item' + (n.id === currentNoteId ? ' active' : '');

                const title = document.createElement('span');
                title.textContent = n.title;

                const del = document.createElement('button');
                del.className = 'chapter-delete';
                del.textContent = '×';
                del.setAttribute('data-id', n.id);
                del.onclick = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (notesList.length === 1) { alert('Нельзя удалить единственную заметку'); return; }
                    const id = parseInt(del.getAttribute('data-id'));
                    const target = notesList.find(x => x.id === id);
                    if (!target) return;
                    let ok = true;
                    try { ok = confirm('Переместить "' + target.title + '" в корзину?'); } catch (err) { ok = true; }
                    if (ok) {
                        addToTrash('note', target);
                        notesList = notesList.filter(x => x.id !== id);
                        if (currentNoteId === id) currentNoteId = notesList[0].id;
                        saveAll(); renderNotes(); loadCurrentNote();
                    }
                };

                item.appendChild(title);
                item.appendChild(del);

                item.onclick = () => {
                    saveCurrentNote();
                    currentNoteId = n.id;
                    notesDropdown.classList.remove('open');
                    renderNotes();
                    loadCurrentNote();
                };

                let pressTimer;
                item.addEventListener('touchstart', () => {
                    pressTimer = setTimeout(() => {
                        const newTitle = prompt('Новое название:', n.title);
                        if (newTitle && newTitle.trim()) { n.title = newTitle.trim(); saveAll(); renderNotes(); }
                    }, 600);
                });
                item.addEventListener('touchend', () => clearTimeout(pressTimer));
                item.addEventListener('touchcancel', () => clearTimeout(pressTimer));

                notesDropdown.appendChild(item);
            });
        }

        notesBtn.onclick = () => notesDropdown.classList.toggle('open');

        function loadCurrentNote() {
            const n = notesList.find(x => x.id === currentNoteId);
            if (n) notesArea.value = n.text;
        }

        function saveCurrentNote() {
            const n = notesList.find(x => x.id === currentNoteId);
            if (n) { n.text = notesArea.value; saveAll(); }
        }

        addNoteBtn.onclick = () => {
            saveCurrentNote();
            const num = notesList.length + 1;
            const newNote = { id: Date.now(), title: 'Заметка ' + num, text: '' };
            notesList.push(newNote);
            currentNoteId = newNote.id;
            saveAll(); renderNotes(); loadCurrentNote();
            notesDropdown.classList.add('open');
        };

        // ============ СЧЁТЧИКИ ============
        function countWords(text) {
            if (text.trim() === '') return 0;
            return text.trim().split(/\s+/).length;
        }

        function updateCounter() {
            wordCountSpan.textContent = countWords(editor.value);
            let total = 0;
            chapters.forEach(ch => total += countWords(ch.text));
            const currentCh = chapters.find(c => c.id === currentChapterId);
            if (currentCh) total = total - countWords(currentCh.text) + countWords(editor.value);
            totalCountSpan.textContent = total;
            updateStats();
        }

        function updateStats() {
            statChapters.textContent = chapters.length;
            let total = 0;
            chapters.forEach(ch => total += countWords(ch.text));
            const currentCh = chapters.find(c => c.id === currentChapterId);
            const totalWithCurrent = currentCh
                ? total - countWords(currentCh.text) + countWords(editor.value)
                : total;
            statWords.textContent = totalWithCurrent;

            const lastMod = localStorage.getItem('myBookLastModified');
            if (lastMod) {
                const d = new Date(parseInt(lastMod));
                statDate.textContent = d.toLocaleString('ru-RU', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });
            }

            const goal = parseInt(localStorage.getItem('myBookGoal') || '50000');
            statGoal.textContent = goal;
            const percent = Math.min(100, Math.round((totalWithCurrent / goal) * 100));
            statProgress.textContent = percent + '%';
            progressFill.style.width = percent + '%';
        }

        editGoalBtn.onclick = () => {
            const current = parseInt(localStorage.getItem('myBookGoal') || '50000');
            const newGoal = prompt('Цель (сколько слов):', current);
            if (newGoal && parseInt(newGoal) > 0) {
                localStorage.setItem('myBookGoal', parseInt(newGoal));
                updateStats();
            }
        };

        function showSaved() {
            saveStatus.textContent = 'Сохранено ✅';
            setTimeout(() => { saveStatus.textContent = ''; }, 2000);
        }

        editor.addEventListener('input', () => {
            updateCounter();
            clearTimeout(window.saveTimeout);
            window.saveTimeout = setTimeout(() => { saveCurrentText(); showSaved(); }, 1000);
        });

        notesArea.addEventListener('input', () => {
            clearTimeout(window.notesTimeout);
            window.notesTimeout = setTimeout(() => saveCurrentNote(), 1000);
        });

        addChapterBtn.onclick = () => {
            saveCurrentText();
            const num = chapters.length + 1;
            const newCh = { id: Date.now(), title: 'Глава ' + num, text: '' };
            chapters.push(newCh);
            currentChapterId = newCh.id;
            saveAll(); renderChapters(); loadCurrentChapter();
            chaptersDropdown.classList.add('open');
        };

        saveBtn.onclick = () => { saveCurrentText(); updateCounter(); showSaved(); };

        exportBtn.onclick = () => {
            let fullText = '📖 МОЯ КНИГА\n\n';
            chapters.forEach(ch => {
                fullText += '=== ' + ch.title + ' ===\n\n' + ch.text + '\n\n\n';
            });
            const blob = new Blob([fullText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'моя-книга.txt'; a.click();
            URL.revokeObjectURL(url);
        };

        // ============ ПОЛНОЭКРАННЫЙ РЕЖИМ ============
        function toggleReadingMode() {
            document.body.classList.toggle('reading-mode');
            if (document.body.classList.contains('reading-mode')) {
                window.scrollTo(0, 0);
            }
        }

        fullscreenBtn.onclick = toggleReadingMode;
        readingExit.onclick = toggleReadingMode;

        // ============ ТЕМЫ ============
        function applyTheme(theme) {
            document.body.classList.remove('dark', 'sepia', 'night');
            if (theme !== 'light') document.body.classList.add(theme);
            themeBtn.textContent = THEME_ICONS[theme] || '🎨';
            localStorage.setItem('myBookTheme', theme);
        }
        let currentTheme = localStorage.getItem('myBookTheme') || 'light';
        applyTheme(currentTheme);
        themeBtn.onclick = () => {
            const idx = THEMES.indexOf(currentTheme);
            currentTheme = THEMES[(idx + 1) % THEMES.length];
            applyTheme(currentTheme);
        };

        // ============ ВКЛАДКИ ============
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            };
        });

        // ============ ПЕРСОНАЖИ ============
        function renderCharacters() {
            const current = characters.find(c => c.id === currentCharId);
            charsBtn.textContent = '👤 ' + (current ? current.name : 'Персонажи') + ' ▾';
            charsDropdown.innerHTML = '';

            characters.forEach(c => {
                const item = document.createElement('div');
                item.className = 'chapter-item' + (c.id === currentCharId ? ' active' : '');

                const title = document.createElement('span');
                title.textContent = c.name;

                const del = document.createElement('button');
                del.className = 'chapter-delete';
                del.textContent = '×';
                del.setAttribute('data-id', c.id);
                del.onclick = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (characters.length === 1) { alert('Нельзя удалить единственного персонажа'); return; }
                    const id = parseInt(del.getAttribute('data-id'));
                    const target = characters.find(x => x.id === id);
                    if (!target) return;
                    let ok = true;
                    try { ok = confirm('Переместить "' + target.name + '" в корзину?'); } catch (err) { ok = true; }
                    if (ok) {
                        addToTrash('character', target);
                        characters = characters.filter(x => x.id !== id);
                        if (currentCharId === id) currentCharId = characters[0].id;
                        saveAll(); renderCharacters(); loadCurrentChar();
                    }
                };

                item.appendChild(title);
                item.appendChild(del);

                item.onclick = () => {
                    saveCurrentChar();
                    currentCharId = c.id;
                    charsDropdown.classList.remove('open');
                    renderCharacters();
                    loadCurrentChar();
                };

                let pressTimer;
                item.addEventListener('touchstart', () => {
                    pressTimer = setTimeout(() => {
                        const newName = prompt('Новое имя:', c.name);
                        if (newName && newName.trim()) { c.name = newName.trim(); saveAll(); renderCharacters(); }
                    }, 600);
                });
                item.addEventListener('touchend', () => clearTimeout(pressTimer));
                item.addEventListener('touchcancel', () => clearTimeout(pressTimer));

                charsDropdown.appendChild(item);
            });
        }

        charsBtn.onclick = () => charsDropdown.classList.toggle('open');

        function loadCurrentChar() {
            const c = characters.find(x => x.id === currentCharId);
            if (c) {
                charNameInput.value = c.name;
                charDescInput.value = c.desc || '';
                showCharPhoto();
            }
        }

        function saveCurrentChar() {
            const c = characters.find(x => x.id === currentCharId);
            if (c) {
                c.name = charNameInput.value.trim() || c.name;
                c.desc = charDescInput.value;
                saveAll();
            }
        }

        addCharBtn.onclick = () => {
            saveCurrentChar();
            const num = characters.length + 1;
            const newChar = { id: Date.now(), name: 'Персонаж ' + num, desc: '' };
            characters.push(newChar);
            currentCharId = newChar.id;
            saveAll(); renderCharacters(); loadCurrentChar();
            charsDropdown.classList.add('open');
        };

        charNameInput.addEventListener('input', () => {
            clearTimeout(window.charTimeout);
            window.charTimeout = setTimeout(() => {
                saveCurrentChar();
                renderCharacters();
            }, 800);
        });

        charDescInput.addEventListener('input', () => {
            clearTimeout(window.charDescTimeout);
            window.charDescTimeout = setTimeout(() => saveCurrentChar(), 800);
        });

        // ============ КАРТИНКИ ПЕРСОНАЖЕЙ ============
        function showCharPhoto() {
            const c = characters.find(x => x.id === currentCharId);
            if (c && c.photo) {
                charPhotoPreview.innerHTML = '<img src="' + c.photo + '" alt="Фото">';
                charPhotoPreview.style.display = 'block';
                charPhotoRemove.style.display = 'inline-block';
            } else {
                charPhotoPreview.innerHTML = '';
                charPhotoPreview.style.display = 'none';
                charPhotoRemove.style.display = 'none';
            }
        }

        charPhotoBtn.onclick = () => charPhotoInput.click();

        charPhotoInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxSize = 300;
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > maxSize) { h = h * maxSize / w; w = maxSize; } }
                    else { if (h > maxSize) { w = w * maxSize / h; h = maxSize; } }
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    const compressed = canvas.toDataURL('image/jpeg', 0.7);

                    const c = characters.find(x => x.id === currentCharId);
                    if (c) {
                        c.photo = compressed;
                        saveAll();
                        showCharPhoto();
                    }
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
            charPhotoInput.value = '';
        };

        charPhotoRemove.onclick = () => {
            let ok = true;
            try { ok = confirm('Удалить фото персонажа?'); } catch (err) { ok = true; }
            if (ok) {
                const c = characters.find(x => x.id === currentCharId);
                if (c) {
                    delete c.photo;
                    saveAll();
                    showCharPhoto();
                }
            }
        };

        // ============ ПОИСК ============
        const searchInput = document.getElementById('search-input');
        const replaceInput = document.getElementById('replace-input');
        const replaceAllBtn = document.getElementById('replace-all-btn');
        const searchResults = document.getElementById('search-results');

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function highlightText(text, query) {
            if (!query) return escapeHtml(text);
            const escaped = query.replace(/[.*+?$^{}()|[\]\\]/g, '\\$&');
            const regex = new RegExp('(' + escaped + ')', 'gi');
            return escapeHtml(text).replace(regex, '<mark>$1</mark>');
        }

        function performSearch() {
            const query = searchInput.value.trim();
            searchResults.innerHTML = '';
            if (query.length < 2) {
                searchResults.innerHTML = '<div class="search-empty">Введи минимум 2 символа</div>';
                return;
            }
            saveCurrentText();
            let found = false;
            chapters.forEach(ch => {
                const text = ch.text || '';
                const lowerText = text.toLowerCase();
                const lowerQuery = query.toLowerCase();
                let index = lowerText.indexOf(lowerQuery);
                let count = 0, firstIndex = -1;
                while (index !== -1) {
                    if (firstIndex === -1) firstIndex = index;
                    count++;
                    index = lowerText.indexOf(lowerQuery, index + 1);
                }
                if (count > 0) {
                    found = true;
                    const item = document.createElement('div');
                    item.className = 'search-result-item';
                    const start = Math.max(0, firstIndex - 30);
                    const end = Math.min(text.length, firstIndex + query.length + 50);
                    const snippet = (start > 0 ? '...' : '') + text.substring(start, end) + (end < text.length ? '...' : '');
                    item.innerHTML =
                        '<div class="search-result-title">📖 ' + escapeHtml(ch.title) + ' — найдено: ' + count + '</div>' +
                        '<div class="search-result-snippet">' + highlightText(snippet, query) + '</div>';
                    item.onclick = () => {
                        currentChapterId = ch.id;
                        renderChapters(); loadCurrentChapter();
                        chaptersDropdown.classList.remove('open');
                        setTimeout(() => {
                            const pos = editor.value.toLowerCase().indexOf(query.toLowerCase());
                            if (pos !== -1) {
                                editor.focus();
                                editor.setSelectionRange(pos, pos + query.length);
                                const linesBefore = editor.value.substring(0, pos).split('\n').length;
                                editor.scrollTop = Math.max(0, (linesBefore - 3) * 26);
                            }
                        }, 100);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    };
                    searchResults.appendChild(item);
                }
            });
            if (!found) searchResults.innerHTML = '<div class="search-empty">Ничего не найдено 😔</div>';
        }

        searchInput.addEventListener('input', () => {
            clearTimeout(window.searchTimeout);
            window.searchTimeout = setTimeout(performSearch, 300);
        });

        replaceAllBtn.onclick = () => {
            const find = searchInput.value.trim();
            const replace = replaceInput.value;
            if (find.length < 2) { alert('Введи минимум 2 символа'); return; }
            let ok = true;
            try { ok = confirm('Заменить "' + find + '" на "' + replace + '" во ВСЕХ главах?'); } catch (err) { ok = true; }
            if (!ok) return;
            let total = 0;
            chapters.forEach(ch => {
                const regex = new RegExp(find.replace(/[.*+?$^{}()|[\]\\]/g, '\\$&'), 'gi');
                const matches = ch.text.match(regex);
                if (matches) { total += matches.length; ch.text = ch.text.replace(regex, replace); }
            });
            saveAll(); loadCurrentChapter(); updateCounter(); performSearch();
            alert('Заменено: ' + total + ' раз');
        };

        // ============ СТАРТ ============
        loadAll();
        renderChapters();
        renderNotes();
        renderCharacters();
        updateStats();

        setTimeout(() => {
            if (chapters.length > 0) loadCurrentChapter();
        }, 100);
    </script>
</body>
</html>
